<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./styles.css" />
    <link
      rel="stylesheet"
      href="//use.fontawesome.com/releases/v5.0.7/css/all.css"
    />
    <script src="./script.js" defer></script>
    <script src="./utils/_api-key.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.18.1/moment.min.js"></script>
  </head>
  <body>
    <div class="wrapper">
      <div>
        <h2>Seu calendário de vídeos</h2>
        <div id="days_group"></div>
      </div>

      <div>
        <h2>Busque vídeos do seu interesse</h2>
        <div class="search_bar_group">
          <input
            type="text"
            name="search_bar"
            placeholder="Procurar vídeo..."
            class="search_bar"
          />
          <button class="search_btn" id="submit-btn">
            <i class="fa fa-search"></i>
          </button>
        </div>
        <div id="videos_group"></div>
      </div>
    </div>
  </body>
</html>
